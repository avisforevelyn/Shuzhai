<style>
  :root { --bg:#f6f6f8; --paper:#ffffff; --ink:#3d3d47; --dim:#7a7a88; --faint:#b5b5c2; --line:rgba(120,120,140,.16); --silver:#c9c9d6; --accent:#6f6f8e; --rose:#e8a3b8; --ok:#5fa37a; --off:#c46b6b; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --serif:"Cormorant Garamond","EB Garamond","Noto Serif SC","Songti SC",Georgia,serif; --cn:"Noto Serif SC","Songti SC",serif; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17171c; --paper:#1f1f26; --ink:#e4e4ec; --dim:#9a9aa8; --faint:#5c5c6a; --line:rgba(200,200,220,.12); --silver:#3a3a48; --accent:#b9b9d6; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }

  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }

  button:disabled { opacity:.45; cursor:default; }

  details.item { background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; overflow:hidden; }

  details.item pre { margin:0; padding:10px 14px 14px; white-space:pre-wrap; word-break:break-word; font-family:var(--cn); font-size:13px; line-height:1.8; color:var(--ink); }

  .kvtable > div { max-width:100%; overflow-wrap:anywhere; word-break:break-word; }

  .bar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:8px 0; margin:6px -2px 0; }
  .empty { text-align:center; color:var(--dim); font-size:12px; padding:30px 0; font-family:var(--serif); font-style:italic; letter-spacing:.06em; }
  .foot { text-align:center; margin-top:34px; font-family:var(--serif); font-style:italic; font-size:11.5px; color:var(--faint); letter-spacing:.08em; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 24px); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:12px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; }

  select { font-family:inherit; font-size:12px; padding:6px 10px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
  details.sfold { margin-top:22px; }
  details.sfold > summary { list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:10px; }
  details.sfold > summary::-webkit-details-marker { display:none; }
  details.sfold > summary .st { font-family:var(--serif); font-weight:400; font-size:20px; letter-spacing:.05em; }
  details.sfold > summary .n { font-family:var(--mono); font-size:10.5px; color:var(--dim); letter-spacing:.08em; }
  details.sfold > summary .arrow { color:var(--faint); font-size:11px; margin-left:auto; transition:transform .2s; }

  .vform input, .vform select { width:100%; font-family:inherit; font-size:13px; padding:8px 11px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); outline:none; }

  .fpick { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
  .fpk { font-size:12px; padding:6px 13px; border-radius:99px; border:1px solid var(--line); background:var(--bg); color:var(--dim); cursor:pointer; }
  .fpk.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .selbar { position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--paper); border-top:1px solid var(--line); padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; align-items:center; gap:8px; box-shadow:0 -4px 20px rgba(0,0,0,.12); }
  .selbar #selCount { font-size:12.5px; color:var(--dim); margin-right:auto; }
  .selbar button { font-size:12.5px; padding:8px 14px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  .selbar #selDel { color:var(--off); border-color:color-mix(in srgb,var(--off) 40%,transparent); }
  .vtile { position:relative; }

  .vver { padding:9px 0; border-top:1px dashed var(--line); font-size:12px; margin-top:8px; }

  .vver .vl { font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:1px 8px; }
  .vver-sub { margin-top:6px; color:var(--dim); overflow-wrap:anywhere; word-break:break-word; line-height:1.5; }
  .vver-sub .vd { color:var(--faint); font-family:var(--mono); font-size:10px; }
  .vver .vl2 { font-family:var(--serif); font-size:12px; color:var(--dim); }
  .vacts2 { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .vt-glyph { width:100%; aspect-ratio:3/4; border-radius:12px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:30px; color:var(--dim); }
  .vt-glyph.k-preset { background:color-mix(in srgb, var(--accent) 13%, var(--paper)); }
  .vt-glyph.k-book { background:color-mix(in srgb, var(--ok) 13%, var(--paper)); }
  .vt-glyph.k-beauty { background:color-mix(in srgb, var(--rose) 15%, var(--paper)); }
  #uploadbar { margin-top:16px; }
  .folderbar { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; }

  .vtags { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .vtag { font-size:10.5px; padding:2px 9px; border-radius:99px; background:color-mix(in srgb, var(--accent) 12%, var(--paper)); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); color:var(--accent); cursor:pointer; }
  .vtag:active { opacity:.6; }
  .vmodal-card.pv-card { display:flex; flex-direction:column; max-height:88vh; overflow:hidden; padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 14px); }

  /* iOS 聚焦缩放: 输入类字体 <16px 会让 Safari 自动放大整页, 统一顶到 16px 消除 */
  input, textarea, select { font-size:16px !important; }
  .vres .vshelf { display:flex; gap:12px; align-items:flex-start; }
  .vcover { width:70px; height:94px; border-radius:11px; flex-shrink:0; background:var(--bg); border:1px solid var(--line); background-size:cover; background-position:center; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--faint); font-family:var(--serif); font-size:15px; letter-spacing:.05em; overflow:hidden; position:relative; }
  .vcover .cam { position:absolute; right:3px; bottom:3px; font-size:9px; background:rgba(0,0,0,.45); color:#fff; border-radius:6px; padding:1px 5px; letter-spacing:.04em; }
  .vinfo { flex:1; min-width:0; }

  /* ───────── 电脑版 · 宽屏两栏 (>=1024px) ───────── */
  @media (min-width: 1024px) {
    html, body { overflow-x: clip; }

    .vgrid-txt { grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); }

    button:not(:disabled):hover, .btn:hover, .tab:hover, .vvt:hover, .fchip:hover, .fpk:hover, .vminibtn:hover, .vmodal-x:hover { border-color: var(--accent); color: var(--ink); }

  .pickbtn { display:none; }
  .side { display:none; }

<script>
(function(){
  var qs = new URLSearchParams(location.search); if (qs.get('embed')==='1') document.body.classList.add('embed');

  var $ = function(s){ return document.querySelector(s); };
  var out = $('#out'), toastEl = $('#toast');
  function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); setTimeout(function(){ toastEl.classList.remove('show'); }, 1600); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function txt(v){ if (v==null) return ''; if (typeof v==='string') return v; try { return JSON.stringify(v, null, 2); } catch(e){ return String(v); } }
  function has(v){ return v!=null && String(v).trim()!==''; }
  var docs = [];   // {name, kind, title, sections:[{title, desc, items:[{ix,title,tags:[{t,cls}],kv:[[k,v]],body}], table:[[k,v]]}], md}

  // ───────── PNG: 读 tEXt chara / ccv3 ─────────
  function pngChara(buf){
    var u8 = new Uint8Array(buf); if (u8.length<8 || u8[0]!==0x89 || u8[1]!==0x50) return null;
    var p = 8, found = {};
    while (p+8 <= u8.length){
      var len = (u8[p]<<24|u8[p+1]<<16|u8[p+2]<<8|u8[p+3])>>>0; var type = String.fromCharCode(u8[p+4],u8[p+5],u8[p+6],u8[p+7]);
      if (type==='tEXt'){ var d=u8.subarray(p+8,p+8+len); var z=d.indexOf(0); var key=String.fromCharCode.apply(null,d.subarray(0,z)); var val=''; for (var i=z+1;i<d.length;i++) val+=String.fromCharCode(d[i]); found[key]=val; }
      if (type==='IEND') break; p += 12+len;
    }
    var b64 = found.ccv3 || found.chara; if (!b64) return null;
    try { var bin=atob(b64); var bytes=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return JSON.parse(new TextDecoder('utf-8').decode(bytes)); } catch(e){ return null; }
  }

  // ───────── 识别 ─────────
  // 角色卡的各种皮: V1 裸卡 / V2 V3 spec / {data:{...}} / {character:{...}} / 老 TavernAI-Pygmalion(char_name,char_persona,world_scenario,char_greeting,example_dialogue) / 双重编码的字符串
  var CARD_ALIAS = { char_name:'name', char_persona:'personality', world_scenario:'scenario', char_greeting:'first_mes', example_dialogue:'mes_example', first_message:'first_mes', greeting:'first_mes', persona:'description', example_dialogs:'mes_example', alternate_greeting:'alternate_greetings' };
  function cardLike(d){
    if (!d || typeof d!=='object' || Array.isArray(d)) return false;
    if (d.first_mes!=null || d.mes_example!=null || d.char_greeting!=null || d.char_persona!=null || d.world_scenario!=null || d.first_message!=null || d.greeting!=null || d.example_dialogue!=null) return true;
    if (Array.isArray(d.alternate_greetings) && d.alternate_greetings.length) return true;
    if (d.description!=null && (d.name!=null || d.personality!=null || d.scenario!=null || d.char_name!=null)) return true;
    if (d.character_book && (d.name!=null || d.char_name!=null)) return true;
    return false;
  }
  function unwrapCard(o){
    if (!o || typeof o!=='object') return null;
    if (cardLike(o)) return o;
    var keys=['data','character','card','char','chara','node'];
    for (var i=0;i<keys.length;i++){ var v=o[keys[i]]; if (v && typeof v==='object'){ if (cardLike(v)) return v; var vv=unwrapCard(v); if (vv) return vv; } }
    return null;
  }
  function normCard(o){
    var d = unwrapCard(o) || ((o && o.data && typeof o.data==='object') ? o.data : o) || {};
    var n = {}; Object.keys(d).forEach(function(k){ n[k]=d[k]; });
    Object.keys(CARD_ALIAS).forEach(function(k){ if (n[k]!=null && n[CARD_ALIAS[k]]==null) n[CARD_ALIAS[k]]=n[k]; });
    if (typeof n.alternate_greetings==='string') n.alternate_greetings=[n.alternate_greetings];
    if (n.tags && typeof n.tags==='string') n.tags=n.tags.split(/[,，、]/).map(function(s){ return s.trim(); }).filter(Boolean);
    return n;
  }
  function detect(o){
    if (typeof o==='string'){ try { o=JSON.parse(o); } catch(e){ return 'unknown'; } }
    if (!o || typeof o!=='object') return 'unknown';
    if (o.spec && /chara_card/.test(String(o.spec))) return 'card';
    if (unwrapCard(o)) return 'card';
    if (Array.isArray(o.prompts) || Array.isArray(o.prompt_order)) return 'preset';
    if (o.entries && (typeof o.entries==='object')) return 'book';
    if (Array.isArray(o) && o.length && (o[0].keys || o[0].key || o[0].content!=null)) return 'book';
    if (o.temperature!=null && o.openai_max_context!=null) return 'preset';
    // 酒馆主题(界面美化)json: 一眼认得出的字段
    if (o.custom_css!=null || (o.blur_strength!=null && o.chat_width!=null) || (o.main_text_color!=null && o.chat_tint_color!=null)) return 'beauty';
    return 'unknown';
  }

  // ───────── 预设 ─────────
  function parsePreset(o, name){
    var prompts = Array.isArray(o.prompts) ? o.prompts : [];
    var byId = {}; prompts.forEach(function(p){ if (p && p.identifier!=null) byId[String(p.identifier)] = p; });
    var orders = Array.isArray(o.prompt_order) ? o.prompt_order.filter(function(x){ return x && Array.isArray(x.order); }) : [];
    orders.sort(function(a,b){ return b.order.length - a.order.length; });
    var sections = [];
    // 参数
    var PK = ['temperature','top_p','top_k','top_a','min_p','frequency_penalty','presence_penalty','repetition_penalty','openai_max_context','openai_max_tokens','max_context_unlocked','stream_openai','wrap_in_quotes','names_behavior','send_if_empty','impersonation_prompt','new_chat_prompt','new_group_chat_prompt','new_example_chat_prompt','continue_nudge_prompt','group_nudge_prompt','wi_format','scenario_format','personality_format','assistant_prefill','assistant_impersonation','claude_use_sysprompt','use_makersuite_sysprompt','squash_system_messages','continue_prefill','continue_postfix','function_calling','seed','n','reasoning_effort','show_thoughts','enable_web_search','request_images','extensions'];
    var table = []; PK.forEach(function(k){ if (o[k]!==undefined && o[k]!=='' && !(typeof o[k]==='object' && !Object.keys(o[k]||{}).length)) table.push([k, typeof o[k]==='object' ? JSON.stringify(o[k]) : String(o[k])]); });
    sections.push({ title:'参数', desc:'采样与格式设置，原样列出。', table: table });
    var used = {};
    orders.forEach(function(ord, oi){
      var items = []; var on=0;
      ord.order.forEach(function(e, k){
        var id = String(e.identifier); var p = byId[id]; used[id] = true;
        var enabled = e.enabled !== false; if (enabled) on++;
        var tags = [{t: enabled?'启用':'关闭', cls: enabled?'on':'off'}];
        if (!p) { items.push({ ix:k+1, title:id+'（顺序表里有、prompts 里找不到）', tags:tags.concat([{t:'缺失',cls:'off'}]), kv:[], body:'' }); return; }
        if (p.marker) tags.push({t:'占位 marker', cls:'kind'});
        if (p.system_prompt) tags.push({t:'系统', cls:'kind'});
        if (p.role) tags.push({t:'role: '+p.role, cls:''});
        var kv = [['identifier', id]];
        if (p.injection_position!=null) kv.push(['injection_position', p.injection_position===1?'1 · 按深度':'0 · 相对']);
        if (p.injection_depth!=null) kv.push(['depth', p.injection_depth]);
        if (p.injection_order!=null) kv.push(['order', p.injection_order]);
        if (p.forbid_overrides) kv.push(['forbid_overrides', 'true']);
        items.push({ ix:k+1, title:p.name || id, tags:tags, kv:kv, body: p.marker ? '（占位符：这里会插入 '+(p.name||id)+'，没有正文）' : txt(p.content) });
      });
      sections.push({ title:'顺序表 '+(oi+1)+' · character_id '+ord.character_id, desc:'按预设里真实的插入顺序排。共 '+ord.order.length+' 条，其中启用 '+on+' 条。'+(oi===0?'（这是最长的一张表，通常就是真正生效的那张）':''), items: items });
    });
    var rest = prompts.filter(function(p){ return !p || p.identifier==null || !used[String(p.identifier)]; });
    if (rest.length){
      sections.push({ title:'不在任何顺序表里的条目', desc:'prompts 里有、顺序表里没排进去的。旧工具就是把这些和别的角色号的表一起漏掉的。共 '+rest.length+' 条。', items: rest.map(function(p,k){
        var tags=[]; if (p.marker) tags.push({t:'占位 marker',cls:'kind'}); if (p.system_prompt) tags.push({t:'系统',cls:'kind'}); if (p.role) tags.push({t:'role: '+p.role,cls:''}); if (p.enabled===false) tags.push({t:'关闭',cls:'off'});
        var kv=[['identifier', p.identifier]]; if (p.injection_position!=null) kv.push(['injection_position', p.injection_position]); if (p.injection_depth!=null) kv.push(['depth', p.injection_depth]);
        return { ix:k+1, title:p.name || String(p.identifier), tags:tags, kv:kv, body: p.marker ? '（占位符）' : txt(p.content) };
      }) });
    }
    return { name:name, kind:'preset', title:(name||'预设')+'', stats:'prompts '+prompts.length+' 条 · 顺序表 '+orders.length+' 张', sections:sections };
  }

  // ───────── 世界书 ─────────
  function normBook(o){
    var list = [];
    if (Array.isArray(o)) list = o;
    else if (o && o.entries && Array.isArray(o.entries)) list = o.entries;
    else if (o && o.entries && typeof o.entries==='object') list = Object.keys(o.entries).map(function(k){ var e=o.entries[k]; if (e && e.uid==null) e.uid=k; return e; });
    return list.filter(Boolean);
  }
  function bookItems(list){
    var POS = {0:'角色定义前',1:'角色定义后',2:'作者注前',3:'作者注后',4:'按深度 @D',5:'示例前',6:'示例后'};
    // 按 order/insertion_order 排, 再按 uid
    var arr = list.slice().sort(function(a,b){ var oa=(a.order!=null?a.order:(a.insertion_order!=null?a.insertion_order:0)), ob=(b.order!=null?b.order:(b.insertion_order!=null?b.insertion_order:0)); if (oa!==ob) return oa-ob; return (parseInt(a.uid)||0)-(parseInt(b.uid)||0); });
    return arr.map(function(e,k){
      var keys = e.key || e.keys || []; var sec = e.keysecondary || e.secondary_keys || [];
      var enabled = !(e.disable===true || e.enabled===false);
      var ext = e.extensions || {};
      var tags = [{t: enabled?'启用':'关闭', cls: enabled?'on':'off'}];
      if (e.constant || ext.constant) tags.push({t:'常驻 constant', cls:'kind'});
      if (e.selective && sec.length) tags.push({t:'需次关键词', cls:''});
      if (e.vectorized || ext.vectorized) tags.push({t:'向量', cls:''});
      var pos = e.position!=null ? e.position : ext.position; var depth = e.depth!=null ? e.depth : ext.depth;
      var kv = [];
      kv.push(['uid', e.uid!=null?e.uid:(e.id!=null?e.id:k)]);
      if (keys.length) kv.push(['关键词', keys.join(' , ')]);
      if (sec.length) kv.push(['次关键词', sec.join(' , ')]);
      if (pos!=null) kv.push(['位置', (POS[pos]||pos) + (pos===4 && depth!=null ? ' '+depth : '')]);
      if (e.order!=null) kv.push(['order', e.order]); else if (e.insertion_order!=null) kv.push(['order', e.insertion_order]);
      if (e.probability!=null && e.useProbability) kv.push(['概率', e.probability+'%']);
      if (e.role!=null) kv.push(['role', ({0:'system',1:'user',2:'assistant'})[e.role]||e.role]);
      if (e.group) kv.push(['组', e.group]);
      if (e.scanDepth!=null) kv.push(['scanDepth', e.scanDepth]);
      if (e.selectiveLogic!=null) kv.push(['逻辑', ({0:'AND ANY',1:'NOT ALL',2:'NOT ANY',3:'AND ALL'})[e.selectiveLogic]||e.selectiveLogic]);
      var title = (e.comment && String(e.comment).trim()) || (e.name && String(e.name).trim()) || (keys.length ? keys.slice(0,3).join(' / ') : ('条目 '+(k+1)));
      return { ix:k+1, title:title, tags:tags, kv:kv, body: txt(e.content) };
    });
  }
  function parseBook(o, name){
    var list = normBook(o); var items = bookItems(list); var on = list.filter(function(e){ return !(e.disable===true || e.enabled===false); }).length;
    return { name:name, kind:'book', title:(o && o.name) || name || '世界书', stats:'条目 '+list.length+' · 启用 '+on, sections:[{ title:'条目', desc:'按 order 排。关键词、位置、深度、常驻都在每条头上。', items: items }] };
  }

  // ───────── 角色卡 ─────────
  function parseCard(o, name){
    if (typeof o==='string'){ try { o=JSON.parse(o); } catch(e){} }
    var d = normCard(o);
    var sections = [];
    var basic = [];
    ['name','creator','character_version','tags','creator_notes','creatorcomment'].forEach(function(k){ if (has(d[k]) || (Array.isArray(d[k]) && d[k].length)) basic.push([k, Array.isArray(d[k]) ? d[k].join(' , ') : String(d[k])]); });
    if (o.spec) basic.push(['spec', o.spec+' '+(o.spec_version||'')]);
    sections.push({ title:'基本', table: basic });
    var F = [['description','描述 description'],['personality','性格 personality'],['scenario','场景 scenario'],['first_mes','开场白 first_mes'],['mes_example','对话示例 mes_example'],['system_prompt','系统提示 system_prompt'],['post_history_instructions','历史后指令 post_history_instructions']];
    var items = []; var ix = 0;
    F.forEach(function(f){ if (has(d[f[0]])) items.push({ ix:++ix, title:f[1], tags:[], kv:[['字数', String(d[f[0]]).length]], body:String(d[f[0]]) }); });
    var alts = Array.isArray(d.alternate_greetings) ? d.alternate_greetings : [];
    alts.forEach(function(g,i){ items.push({ ix:++ix, title:'备选开场白 '+(i+1), tags:[{t:'alternate',cls:'kind'}], kv:[['字数', String(g).length]], body:String(g) }); });
    var ext = d.extensions || {};

  // 把一个文件读成上传要用的东西: {kind,format,body,filename,name,blob?}。识别不了返回 null。
  function readForUpload(f){

    return new Promise(function(res){
      if (/\.png$/i.test(name)||f.type==='image/png'){ f.arrayBuffer().then(function(buf){ var o=pngChara(buf); if (!o){ res(null); return; } var k=detect(o); res({kind:k,format:'png',body:f,blob:f,filename:name,name:guessName(o,k,name)}); }, function(){ res(null); }); return; }
      f.text().then(function(t){ var o=null; try{ o=JSON.parse(t); }catch(e){} if (o&&typeof o==='object'){ var k=detect(o); res({kind:k,format:'json',body:t,filename:name,name:guessName(o,k,name)}); } else { res({kind:'beauty',format:'text',body:t,filename:name,name:guessName(t,'beauty',name)}); } }, function(){ res(null); });
    });

  // 批量导入: 每个文件自动识别名字, 直接新建资源存成 v1, 不弹表单
  function batchImport(files){

    (function next(){
      if (i>=arr.length){ toast('导入完成 · 存了 '+ok+'/'+arr.length); vaultLoad(); return; }
      var f=arr[i++];
      readForUpload(f).then(function(u){
        if (!u){ next(); return; }
        vaultUploadBin({kind:u.kind,format:u.format,filename:u.filename,name:u.name,version_label:'v1'}, u.body).then(function(r){

  function verFormHtml(title, date, note, vtags, vfolders, kind){
    return '<div class="vform"><div style="font-family:var(--serif);font-size:16px;margin-bottom:2px;">'+title+'</div>'
      +'<label>版本日期（作者更新的日期）</label><input type="date" id="vm_date" value="'+esc(date||'')+'"/>'
      +'<label>这一版备注</label><input id="vm_note" value="'+esc(note||'')+'"/>'
      +'<label>这一版专属标签（留空 = 跟随整份资源）</label><input id="vm_tags" value="'+esc(tagsToInput(vtags))+'" placeholder="留空就用资源的标签"/>'
      +'<label>这一版专属文件夹（留空 = 跟随资源，可多选）</label>'+folderPicker('vm_fpick', kind, vfolders||[])
      +'<div class="row" style="margin-top:14px;"><button class="primary" id="vm_save">保存</button><button id="vm_close">取消</button></div></div>';
  }
  function closeVer(){ verCtx=null; $('#verModal').hidden=true; }
  function bindVerForm(){
    $('#vm_close').onclick=closeVer;
    $('#vm_save').onclick=function(){
      var d=$('#vm_date').value.trim(), n=$('#vm_note').value.trim(), vt=parseTags($('#vm_tags').value), vf=pickedFolders($('#vm_fpick')); $('#vm_save').disabled=true;
      if (verCtx.mode==='edit'){
        vapi.vedit({version_id:verCtx.vid, vdate:d, note:n, tags:vt, folders:vf}).then(function(){ toast('改好了'); closeVer(); vaultLoad(); });
      } else {
        var u=verCtx.u, rid=verCtx.rid;
        vaultUploadBin({resource_id:rid,format:u.format,filename:u.filename,version_date:d,version_note:n,v_tags:vt.join('|'),v_folders:vf.join('|')}, u.body).then(function(r){
          if (r&&r.ok){ toast('加了新版本 '+(r.label||'')); if (u.format==='png'&&u.blob){ makeThumb(u.blob).then(function(dd){ return vapi.setCover(rid,dd); }).then(function(){ closeVer(); vaultLoad(); }, function(){ closeVer(); vaultLoad(); }); } else { closeVer(); vaultLoad(); } }
          else { toast('失败：'+((r&&r.error)||'')); $('#vm_save').disabled=false; }
        }).catch(function(e){ toast('失败：'+String(e&&e.message||e).slice(0,30)); $('#vm_save').disabled=false; });
      }
    };
  }
  function openVerEdit(vid){ var cur=findVer(vid)||{}; verCtx={mode:'edit',vid:vid}; $('#verBody').innerHTML=verFormHtml('改这一版', cur.vdate||'', cur.note||'', cur.tags||[], cur.folders||[], vaultKind); bindVerForm(); $('#verModal').hidden=false; }
  function openVerAdd(rid, u){ verCtx={mode:'add',rid:rid,u:u}; $('#verBody').innerHTML=verFormHtml('新版本', '', '', [], [], vaultKind); bindVerForm(); $('#verModal').hidden=false; }
  $('#verModal').addEventListener('click', function(e){ if (e.target.id==='verModal') closeVer(); });
  function vaultView(vid){
    vapi.get(vid).then(function(r){
      if (!r.ok){ toast('取不到：'+(r.error||'')); return; }
      var v=r.version, obj, nm=v.filename||v.label||'仓库';
      try {
        if (v.format==='png'){ var u8=b642u8(v.content); obj=pngChara(u8.buffer); if (!obj){ toast('这个 png 里没角色卡'); return; } pendingUp={ kind:vaultKind, format:'png', filename:nm, guess:nm, blob:new Blob([u8],{type:'image/png'}) }; }
        else if (v.format==='text'){ obj=v.content; pendingUp={ kind:vaultKind, format:'text', filename:nm, guess:nm, text:v.content }; }
        else { obj=JSON.parse(v.content); pendingUp={ kind:vaultKind, format:'json', filename:nm, guess:nm, text:v.content }; }
      } catch(e){ toast('解析失败：'+e.message.slice(0,40)); return; }
      docs=[]; closeModal(); addJson(obj, nm); openPreview();
    });
  }
  function vaultDownload(vid){
    var a=document.createElement('a'); a.href='api/vault/download?vid='+encodeURIComponent(vid);
    document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 400); toast('开始下载…');
  }
  function findVer(vid){ var f=null; vaultCache.forEach(function(x){ (x.versions||[]).forEach(function(v){ if (v.id===vid) f=v; }); }); return f; }
  function vaultAct(act, vid, rid){
    if (act==='cover'){ coverForRid=rid; $('#vcoverfile').click(); return; }
    if (act==='addver'){ addVerRid=rid; $('#vverfile').click(); return; }
    if (act==='rview'){ var rr=vaultCache.filter(function(x){ return x.id===rid; })[0]; if (rr){ var lt=latestVer(rr); if (lt) vaultView(lt.id); } return; }
    if (act==='toggle'){ expanded[rid]=!expanded[rid]; renderVault(); return; }
    if (act==='view'){ vaultView(vid); return; }
    if (act==='dl'){ vaultDownload(vid); return; }
    if (act==='delV'){ var pr=null; vaultCache.forEach(function(x){ if ((x.versions||[]).some(function(v){ return v.id===vid; })) pr=x; }); var last=pr&&pr.versions.length===1; var msg=last?('⚠ 这是最后一版，删了整份「'+((pr&&pr.name)||'资源')+'」就一起没了，确定？').replace('⚠ ',''):'删掉这个版本？'; if (confirm(msg)) vapi.delV(vid).then(function(){ toast('删了'); vaultLoad(); }); return; }
    if (act==='delR'){ if (confirm('删掉整份资源和它所有版本？')) vapi.delR(rid).then(function(){ toast('删了'); closeModal(); vaultLoad(); }); return; }
    if (act==='edit'){ openEdit(rid); return; }
    if (act==='vedit'){ openVerEdit(vid); return; }
  }
  function vaultDelegate(e){
    if (selMode){ var card=e.target.closest && e.target.closest('.vres,.vtile'); if (card){ var rid=card.getAttribute('data-rid'); if (rid){ if (selSet[rid]) delete selSet[rid]; else selSet[rid]=1; card.classList.toggle('sel'); updateSelBar(); } } return; }
    var tgc=e.target.closest && e.target.closest('[data-tag]');
    if (tgc){ var t=tgc.getAttribute('data-tag'); var sb=$('#vSearch'); if (sb) sb.value=t; vaultQuery=t.toLowerCase(); folderFilter='__all__'; renderVault(); return; }
    var b=e.target.closest && e.target.closest('[data-act]');
    if (b){ vaultAct(b.getAttribute('data-act'), b.getAttribute('data-vid'), b.getAttribute('data-rid')); return; }
    var op=e.target.closest && e.target.closest('[data-open]');
    if (op) openDetail(op.getAttribute('data-open'));
  }
  $('#folderBar').addEventListener('click', function(e){ var b=e.target.closest('button[data-folder]'); if (!b) return; folderFilter=b.getAttribute('data-folder'); renderVault(); });
  function updateSelBar(){ var n=Object.keys(selSet).length; var bar=$('#selBar'); if (bar) bar.hidden=!selMode; var c=$('#selCount'); if (c) c.textContent='已选 '+n; var sb=$('#selBtn'); if (sb){ sb.classList.toggle('primary', selMode); sb.textContent=selMode?'选择中…':'选择'; } }
  $('#selBtn').onclick=function(){ selMode=!selMode; selSet={}; renderVault(); updateSelBar(); };
  $('#newFolderBtn').onclick=function(){ var nm=prompt('给「'+VKIND[vaultKind]+'」新建一个文件夹'); if (!nm||!nm.trim()) return; vapi.folderAdd(vaultKind, nm.trim()).then(function(r){ if (r&&r.ok){ toast('建好了 · '+nm.trim()); vaultLoad(); } else { toast('失败'); } }); };
  $('#selDone').onclick=function(){ selMode=false; selSet={}; updateSelBar(); renderVault(); };
  $('#selDel').onclick=function(){ var ids=Object.keys(selSet); if (!ids.length){ toast('先选几个'); return; } if (!confirm('删掉选中的 '+ids.length+' 份资源(含所有版本)？')) return; var i=0; (function nx(){ if (i>=ids.length){ toast('删了 '+ids.length+' 份'); selMode=false; selSet={}; updateSelBar(); vaultLoad(); return; } vapi.delR(ids[i++]).then(nx,nx); })(); };
  $('#selModal').addEventListener('click', function(e){ if (e.target.id==='selModal') $('#selModal').hidden=true; });
  $('#selFolder').onclick=function(){
    var ids=Object.keys(selSet); if (!ids.length){ toast('先选几个'); return; }
    $('#selBody').innerHTML='<div class="vform"><div style="font-family:var(--serif);font-size:16px;margin-bottom:2px;">给选中的 '+ids.length+' 份加入文件夹</div><label>选文件夹（可多选，点亮=选中）</label>'+folderPicker('sel_fpick', vaultKind, [])+'<div class="row" style="margin-top:14px;"><button class="primary" id="sel_go">加入</button><button id="sel_cancel">取消</button></div></div>';
    $('#selModal').hidden=false;
    $('#sel_cancel').onclick=function(){ $('#selModal').hidden=true; };
    $('#sel_go').onclick=function(){ var chosen=pickedFolders($('#sel_fpick')); if (!chosen.length){ toast('先选文件夹'); return; } $('#sel_go').disabled=true; var i=0; (function nx(){ if (i>=ids.length){ toast('加好了'); $('#selModal').hidden=true; selMode=false; selSet={}; updateSelBar(); vaultLoad(); return; } var rid=ids[i++], r=vaultCache.filter(function(x){ return x.id===rid; })[0]||{}, merged=(r.folders||[]).slice(); chosen.forEach(function(f){ if (merged.indexOf(f)<0) merged.push(f); }); vapi.rename({resource_id:rid, folders:merged}).then(nx,nx); })(); };
  };
  // 长按卡片直接拖动排序(不占 UI, 长按约 0.38s 进入拖拽, 期间移动过大则当滚动放弃)
  (function(){
    var dragEl=null, listEl=null, timer=null, startY=0, armed=false;
    function pt(e){ return (e.touches&&e.touches[0])?e.touches[0]:e; }
    function detach(){ document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onEnd); }
    function cancel(){ if (timer){ clearTimeout(timer); timer=null; } if (dragEl){ dragEl.classList.remove('dragging'); } armed=false; dragEl=null; listEl=null; detach(); }
    function onStart(e){
      if (e.target.closest && e.target.closest('button, .vcover, .vtag, a, input, textarea, select, [data-act]')) return;
      var vres=e.target.closest && e.target.closest('.vres'); if (!vres || !vres.getAttribute('data-rid') || !vres.closest('#vlist')) return;
      startY=pt(e).clientY; armed=false; dragEl=null;
      timer=setTimeout(function(){ armed=true; dragEl=vres; listEl=vres.parentNode; vres.classList.add('dragging'); try{ navigator.vibrate&&navigator.vibrate(15); }catch(x){} }, 380);
      document.addEventListener('touchmove', onMove, {passive:false}); document.addEventListener('touchend', onEnd);
      document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onEnd);
    }
    function onMove(e){
      var y=pt(e).clientY;
      if (!armed){ if (Math.abs(y-startY)>12) cancel(); return; }
      e.preventDefault();
      var sibs=Array.prototype.slice.call(listEl.querySelectorAll('.vres')), placed=false;
      for (var i=0;i<sibs.length;i++){ var s=sibs[i]; if (s===dragEl) continue; var r=s.getBoundingClientRect(); if (y < r.top + r.height/2){ if (dragEl.nextSibling!==s) listEl.insertBefore(dragEl, s); placed=true; break; } }
      if (!placed && listEl.lastChild!==dragEl) listEl.appendChild(dragEl);
    }
    function onEnd(){
      if (timer){ clearTimeout(timer); timer=null; }
      if (armed && dragEl && listEl){
        dragEl.classList.remove('dragging');
        var ids=Array.prototype.slice.call(listEl.querySelectorAll('.vres')).map(function(v){ return v.getAttribute('data-rid'); }).filter(Boolean);
        if (ids.length){ resSort='manual'; try{ localStorage.setItem('fyResSort','manual'); }catch(x){} if ($('#vSort')) $('#vSort').textContent=RS_LABEL['manual']; vapi.reorder(ids).then(function(){ vaultLoad(); }); }
      }
      armed=false; dragEl=null; listEl=null; detach();
    }
    document.addEventListener('touchstart', onStart, {passive:true});
    document.addEventListener('mousedown', onStart);
  })();
  $('#vlist').addEventListener('click', vaultDelegate);
  $('#vmodal').addEventListener('click', function(e){ if (e.target.id==='vmodal' || e.target.id==='vmodalX'){ closeModal(); return; } vaultDelegate(e); });
  $('#vToggle').onclick=function(){ vaultViewMode=(vaultViewMode==='list'?'shelf':'list'); try{ localStorage.setItem('fyVaultView', vaultViewMode); }catch(x){} renderVault(); };
  $('#vSort').textContent=RS_LABEL[resSort]||'名字';
  $('#vSort').onclick=function(){ resSort=RS_NEXT[resSort]||'name'; try{ localStorage.setItem('fyResSort',resSort); }catch(x){} $('#vSort').textContent=RS_LABEL[resSort]; renderVault(); };
  $('#vSearch').addEventListener('input', function(e){ vaultQuery=(e.target.value||'').trim().toLowerCase(); renderVault(); });
  $('#vcoverfile').addEventListener('change', function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if (!f||!coverForRid) return; var rid=coverForRid; toast('封面处理中…'); makeThumb(f).then(function(durl){ return vapi.setCover(rid,durl); }).then(function(r){ if (r&&r.ok){ toast('封面换好了'); vaultLoad().then(function(){ if (editRid) openEdit(editRid); }); } else { toast('封面失败：'+((r&&r.error)||'')); } }).catch(function(err){ toast('封面失败：'+String(err&&err.message||err).slice(0,30)); }); });
  var addVerRid=null;
  $('#vverfile').addEventListener('change', function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if (!f||!addVerRid) return; var rid=addVerRid; readForUpload(f).then(function(u){ if (!u){ toast('这个文件读不了'); return; } openVerAdd(rid, u); }); });
  $('#vrefresh').onclick=function(){ vaultLoad(); toast('刷新了'); };
  var VTABS=['book','preset','card','beauty'];
  function switchTab(which){
    VTABS.forEach(function(k){ $('#tab_'+k).classList.toggle('on', which===k); });
    vaultKind=which; folderFilter='__all__'; selMode=false; selSet={}; updateSelBar(); closeModal(); closePreview(); if (vaultCache.length) renderVault(); vaultLoad();
  }
  VTABS.forEach(function(k){ $('#tab_'+k).onclick=function(){ switchTab(k); }; });
  switchTab('book');
})();
</script>
